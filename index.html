<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>Штаб винахідника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="who">
      <span class="label" id="appName">Штаб винахідника</span>
      <input id="kidName" aria-label="Ім'я" placeholder="Твоє ім'я" maxlength="20">
    </div>
    <div class="stats">
      <button class="chip wallet" id="walletChip" aria-label="Гаманець"><b><span id="sWallet">0</span><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></b><span>ноти</span></button>
      <div class="chip"><b id="sWeek">0/5</b><span>тиждень</span></div>
      <button class="iconbtn" id="soundBtn" aria-label="Звук"></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section id="welcome" class="panel" hidden></section>
  <section id="view-day" class="panel" role="tabpanel"></section>
  <section id="view-lab" class="panel" role="tabpanel" hidden></section>
  <section id="view-project" class="panel" role="tabpanel" hidden></section>
  <section id="view-wallet" class="panel" role="tabpanel" hidden></section>
  <section id="view-parent" class="panel" role="tabpanel" hidden></section>
  <p class="note">Прогрес зберігається в цьому браузері. Батькам: раз на тиждень зберігайте резервну копію.</p>
</div>

<!-- Порядок важливий: спершу допоміжні модулі, app.js - останнім. -->
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/sound.js"></script>
<script src="js/fx.js"></script>
<script src="js/generators.js"></script>
<script src="js/sync.js"></script>
<script src="js/modal.js"></script>
<script src="js/rewards.js"></script>
<script src="js/routines.js"></script>
<script src="js/mission.js"></script>
<script src="js/project.js"></script>
<script src="js/wallet.js"></script>
<script src="js/parent.js"></script>
<script src="js/app.js"></script>
</body>
</html>
